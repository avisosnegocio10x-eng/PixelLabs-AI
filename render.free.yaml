services:
  - type: web
    name: pixellabs-content-engine-free
    runtime: docker
    plan: free
    branch: agent/pixellabs-content-engine
    dockerfilePath: ./Dockerfile.free
    healthCheckPath: /healthz
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CONTENT_ENGINE_ENABLED
        value: "true"
      - key: REQUIRE_SUPABASE
        value: "true"
      - key: CONTENT_ENGINE_AUTO_PUBLISH
        value: "false"
      - key: SOCIAL_PUBLISH_MODE
        value: draft
      - key: SOCIAL_EXTERNAL_REQUESTS_ENABLED
        value: "false"
      - key: CONTENT_ENGINE_VIDEO_MODE
        value: disabled
      - key: CONTENT_ENGINE_LOCAL_STORAGE_DURABLE
        value: "false"
      - key: CONTENT_ENGINE_UPLOAD_DIR
        value: /tmp/pixellabs-content/uploads
      - key: CONTENT_ENGINE_WORK_DIR
        value: /tmp/pixellabs-content/work
      - key: CONTENT_ENGINE_MAX_CONCURRENT_VIDEO_JOBS
        value: "0"
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: LOCAL_WORKER_API_TOKEN
        generateValue: true
      - key: LOCAL_WORKER_MAX_ARTIFACT_BYTES
        value: "50331648"
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pixellabs-content
