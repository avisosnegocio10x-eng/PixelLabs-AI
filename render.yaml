services:
  - type: web
    name: pixellabs-content-engine
    runtime: docker
    plan: starter
    branch: agent/pixellabs-content-engine
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CONTENT_ENGINE_ENABLED
        value: "true"
      - key: CONTENT_ENGINE_AUTO_PUBLISH
        value: "false"
      - key: SOCIAL_PUBLISH_MODE
        value: draft
      - key: CONTENT_ENGINE_UPLOAD_DIR
        value: /app/storage/uploads
      - key: CONTENT_ENGINE_WORK_DIR
        value: /app/storage/work
      - key: CONTENT_ENGINE_MAX_CONCURRENT_VIDEO_JOBS
        value: "1"
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pixellabs-content
    disk:
      name: pixellabs-content-data
      mountPath: /app/storage
      sizeGB: 10
